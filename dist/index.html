<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>작성미수</title><meta name="description" content="문단을 배치하고 노이즈 그라데이션으로 꾸미는 글 편집기. PNG 저장."><link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar"><div class="brand">작성미수</div><div class="top-actions"><div class="history-actions" aria-label="편집 기록"><button id="undo" aria-label="실행 취소" title="실행 취소 · Ctrl+Z" disabled>실행 취소</button><button id="redo" aria-label="다시 실행" title="다시 실행 · Ctrl+Shift+Z" disabled>다시 실행</button></div><button id="savePNG" class="primary">PNG 저장</button></div></header>
<main class="workspace design-open">
<aside class="editor-sidebar" id="editorSidebar" aria-label="편집 도구"><div id="sidebarResize" role="separator" aria-label="편집 패널 너비 조절" aria-orientation="vertical" aria-controls="editorSidebar" tabindex="0" title="드래그해서 너비 조절"></div><div class="sidebar-header"><div class="editor-tabs" aria-label="편집 도구"><button id="contentTab" aria-pressed="true" aria-controls="contentPanel">내용</button><button id="designTab" aria-pressed="true" aria-expanded="true" aria-controls="designSidebar">디자인</button></div><details class="selection-help"><summary aria-label="문단 선택 안내">?</summary><div class="help-content">Shift를 누른 채 문단 제목이나 지면의 문단을 클릭하면 여러 문단을 선택할 수 있어요.</div></details></div><section class="panel left-panel" id="contentPanel" role="region" aria-labelledby="contentTab"><div id="blockList" class="block-list"></div><div class="add-tools"><button id="addText">문단 추가</button><button id="addLine">구분선</button></div><div class="left-bottom"><button id="autoLayout">문단 자동 배치</button></div></section></aside>
<aside class="design-sidebar" id="designSidebar" aria-label="디자인 도구"><div class="sidebar-header"><h2>디자인</h2><button id="closeDesign" aria-label="디자인 접기" title="디자인 접기"></button></div><section class="panel right-panel" id="designPanel" aria-label="디자인 설정"><section class="control-section"><h3>배경</h3><div class="palettes" id="palettes"></div><div class="color-row"><label>색 1<input id="color1" type="color" value="#203b40"></label><label>색 2<input id="color2" type="color" value="#435465"></label></div><label class="range-label">노이즈 <output id="noiseValue">18%</output><input id="noise" type="range" min="0" max="60" value="18"></label></section><section class="control-section typography-group" id="typographyControls" aria-label="글자 설정"></section><section class="control-section" id="selectionPanel"><h3 id="selectionTitle">선택한 문단</h3><div id="selectionControls"></div></section><details class="control-section"><summary>지면 크기와 여백</summary><div class="field-grid"><label>너비 (px)<input id="pageWidth" type="number" min="400" max="1600" step="40" value="800"></label><label>기본 여백 (px)<input id="pageMargin" type="number" min="24" max="160" value="80"></label></div></details></section></aside>
<section class="stage-panel" aria-label="편집 화면"><div class="stage-toolbar"><h2 class="stage-title">지면</h2><div class="zoom-tools"><button id="zoomOut" aria-label="축소">−</button><span id="zoomLabel">75%</span><button id="zoomIn" aria-label="확대">＋</button><button id="zoomFit">맞춤</button></div></div><div class="stage-scroll" id="stageScroll"><div id="boardShell"><div id="board"><canvas id="artwork" aria-label="편집 중인 지면"></canvas><div id="overlays"></div></div></div></div><div class="stage-footer"><span id="sizeLabel">800 × 900 px</span><span id="selectionHint" hidden></span></div></section>

</main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div><script type="module" src="app.js"></script>
</body></html>
