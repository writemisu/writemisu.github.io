<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>작성미수</title><meta name="description" content="문단을 배치하고 노이즈 그라데이션으로 꾸미는 글 편집기. PNG 저장."><link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar"><div class="brand-tools"><div class="brand">작성미수</div><div class="mode-tabs segmented" role="group" aria-label="편집 모드"><button type="button" id="pngMode" aria-pressed="true">PNG</button><button type="button" id="htmlMode" aria-pressed="false">HTML</button></div></div><div class="top-actions"><div class="history-actions" aria-label="편집 기록"><button id="undo" aria-label="실행 취소" title="실행 취소 · Ctrl+Z" disabled>실행 취소</button><button id="redo" aria-label="다시 실행" title="다시 실행 · Ctrl+Shift+Z" disabled>다시 실행</button></div><div class="html-save-tools" data-html-only hidden><button type="button" id="copyRichHTML">서식 복사</button><button type="button" id="copyHTML" class="primary">HTML 복사</button></div><div class="png-save-tools" data-png-only><button type="button" id="pngScale" popovertarget="pngScaleMenu" aria-label="PNG 저장 크기 선택"><span id="pngScaleLabel">기본 크기</span><span class="presentation-chevron" aria-hidden="true"></span></button><div id="pngScaleMenu" class="png-scale-menu" popover="auto" role="group" aria-label="PNG 저장 크기"><button type="button" data-png-scale="1" aria-pressed="true"><span>기본 크기</span><small></small></button><button type="button" data-png-scale="2" aria-pressed="false"><span>고화질 2배</span><small></small></button></div><button id="savePNG" class="primary">PNG 저장</button></div></div></header>
<main class="workspace design-open">
<aside class="editor-sidebar" id="editorSidebar" aria-label="편집 도구"><div id="sidebarResize" role="separator" aria-label="편집 패널 너비 조절" aria-orientation="vertical" aria-controls="editorSidebar" tabindex="0" title="드래그해서 너비 조절"></div><div class="sidebar-header"><div class="editor-tabs" aria-label="편집 도구"><button id="contentTab" aria-pressed="true" aria-controls="contentPanel">내용</button><button id="designTab" aria-pressed="true" aria-expanded="true" aria-controls="designSidebar">디자인</button></div><details class="selection-help" data-png-only><summary aria-label="문단 선택 안내">?</summary><div class="help-content">Shift를 누른 채 문단 제목이나 지면의 문단을 클릭하면 여러 문단을 선택할 수 있어요.</div></details></div><section class="panel left-panel" id="contentPanel" role="region" aria-labelledby="contentTab"><details class="replacement-tools" id="replacementTools" open><summary>단어 치환</summary><div class="replacement-body"><div id="replacementRows" class="replacement-rows"></div><button type="button" id="addReplacement" aria-label="치환 추가" title="치환 추가">＋</button></div></details><div id="htmlTabTools" class="html-tab-tools" data-html-only hidden><div class="html-tab-picker"><select id="htmlTabSelect" aria-label="편집할 탭"></select><button type="button" id="addHTMLTab">탭 추가</button></div><div class="html-tab-heading"><input id="htmlTabTitle" aria-label="탭 제목" placeholder="탭 제목"><button type="button" id="deleteHTMLTab">삭제</button></div><label class="html-option"><input id="htmlTabOpen" type="checkbox">처음부터 펼치기</label></div><div id="blockList" class="block-list"></div><div class="add-tools"><button id="addText">문단 추가</button><button id="addLine">구분선</button></div><div class="left-bottom" data-png-only><button id="autoLayout">문단 자동 배치</button></div></section></aside>
<aside class="design-sidebar" id="designSidebar" aria-label="디자인 도구"><div class="sidebar-header"><h2>디자인</h2><button id="closeDesign" aria-label="디자인 접기" title="디자인 접기"></button></div><section class="panel right-panel" id="designPanel" aria-label="디자인 설정"><details class="control-section design-group" id="backgroundGroup" open><summary id="backgroundTitle">배경</summary><div class="palettes" id="palettes" data-png-only></div><div class="color-row background-colors"><label>색 1<input id="color1" type="color" value="#203b40"><output id="color1Value" data-html-only hidden></output></label><label>색 2<input id="color2" type="color" value="#435465"><output id="color2Value" data-html-only hidden></output></label><label data-html-only hidden>기본 글자색<input id="htmlTextColor" type="color" value="#e8e5e1"><output id="htmlTextColorValue"></output></label><label data-html-only hidden>포인트 색<input id="htmlAccent" type="color" value="#bda47b"><output id="htmlAccentValue" data-html-only hidden></output></label><label data-html-only hidden>보조 글자<input id="htmlMuted" type="color" value="#92949c"><output id="htmlMutedValue" data-html-only hidden></output></label><label data-html-only hidden>테두리 색<input id="htmlBorder" type="color" value="#44464c"><output id="htmlBorderValue"></output></label></div><div data-html-only hidden><button type="button" id="htmlReset">HTML 기본값 복원</button></div><label class="range-label" data-png-only>노이즈 <output id="noiseValue">18%</output><input id="noise" type="range" min="0" max="60" value="18"></label></details><details class="control-section typography-group design-group" id="typographyGroup" open><summary>글자</summary><div id="typographyControls" aria-label="글자 설정"></div></details><details class="control-section design-group" id="quoteGroup" open><summary>대사 서식</summary><div id="quoteControls" aria-label="대사 서식"></div></details><details class="control-section design-group" id="selectionPanel" open><summary id="selectionTitle">선택한 문단</summary><div id="selectionControls"></div></details><details class="control-section design-group" id="htmlDocumentSettings" data-html-only hidden open><summary>레이아웃</summary><label class="html-option"><input id="htmlFrame" type="checkbox">프레임 표시</label><div id="htmlFrameFields" hidden><label class="full-field">모서리 둥글기 (px)<input id="htmlRadius" type="number" min="0" max="40" value="10"></label></div><div class="field-grid"><label>최대 너비 (px)<input id="htmlWidth" type="number" min="280" max="1600" value="680"></label><label>안쪽 여백 (px)<input id="htmlPadding" type="number" min="0" max="120" value="44"></label></div><label class="range-label">문단 간격<output id="htmlGapValue">24px</output><input id="htmlGap" type="range" min="0" max="120" value="24"></label></details><details class="control-section design-group" id="decorationGroup" data-html-only hidden><summary>장식</summary><label class="html-option"><input id="htmlDecoration" type="checkbox">장식 표시</label><div id="htmlDecorationFields" hidden><div class="field-grid"><label>상단 장식<select id="htmlHeaderDecoration"><option value="none">없음</option><option value="hairline">짧은 선</option></select></label><label>하단 장식<select id="htmlFooterDecoration"><option value="none">없음</option><option value="hairline">Hairline · 가는 선</option><option value="editorial">Editorial · 문구와 선</option></select></label></div><label class="full-field">레이블<input id="htmlDecorationLabel" type="text" value="END OF EXCERPT"></label></div></details><details class="control-section design-group" id="pageSettings" data-png-only><summary>지면 크기와 여백</summary><div class="field-grid"><label>너비 (px)<input id="pageWidth" type="number" min="400" max="1600" step="40" value="800"></label><label>기본 여백 (px)<input id="pageMargin" type="number" min="24" max="160" value="80"></label></div></details></section></aside>
<section class="stage-panel" aria-label="편집 화면"><div class="stage-toolbar"><h2 class="stage-title" id="stageTitle">지면</h2><div class="html-view-tools segmented" data-html-only hidden role="group" aria-label="HTML 보기"><button type="button" id="htmlPreviewTab" aria-pressed="true">미리보기</button><button type="button" id="htmlCodeTab" aria-pressed="false">코드</button></div><div class="zoom-tools" data-png-only><button id="zoomOut" aria-label="축소">−</button><button type="button" id="zoomLabel" aria-label="100%로 맞추기" title="100%로 맞추기">75%</button><button id="zoomIn" aria-label="확대">＋</button><button id="zoomFit">맞춤</button></div></div><div class="stage-scroll" id="stageScroll"><div id="htmlStage" data-html-only hidden><iframe id="htmlPreview" title="HTML 결과 미리보기" sandbox="allow-same-origin"></iframe><textarea id="htmlCode" aria-label="복사할 HTML 코드" readonly spellcheck="false" hidden></textarea></div><div id="boardShell" data-png-only><div id="board"><canvas id="artwork" aria-label="편집 중인 지면"></canvas><div id="overlays"></div></div></div></div><div class="stage-footer"><div class="stage-size"><span id="htmlSizeLabel" data-html-only hidden></span><span id="sizeLabel" data-png-only>800 × 900 px</span><details class="selection-help size-help" data-png-only><summary aria-label="지면 크기 추천">?</summary><div class="help-content">SNS : 700 x 780 px<br>웹 : 너비 500 px 추천</div></details></div><span id="draftStatus" role="status" aria-live="polite" title="이 브라우저에 저장됩니다.">자동 임시저장</span></div></section>

</main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div><script type="module" src="app.js"></script>
</body></html>
